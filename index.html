<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODD SIGNAL GAMES</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0b;
      color: #ecece8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      color: #00e5ff;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    p {
      color: #c8ccd4;
      margin-bottom: 2rem;
    }
    .games {
      display: grid;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }
    a.game {
      display: block;
      background: #161618;
      border: 1px solid #00e5ff33;
      color: #ecece8;
      text-decoration: none;
      padding: 1.2rem;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      transition: border-color 0.2s, background 0.2s;
    }
    a.game:hover {
      border-color: #00e5ff;
      background: #1a1a1c;
    }
  </style>
</head>
<body>
  <h1>ODD SIGNAL</h1>
  <p>GAMES</p>
  <div class="games">
    <!-- Add your Roblox game links here -->
    <a class="game" href="https://www.roblox.com/games/PLACE_ID/GAME_NAME" target="_blank">Game Name</a>
    <a class="game" href="https://www.roblox.com/games/PLACE_ID/GAME_NAME" target="_blank">Game Name</a>
  </div>
</body>
</html>
